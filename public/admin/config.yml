backend:
  name: github
  repo: jackcanon/lokislab
  branch: main
  auth_endpoint: api/auth
  cms_label_prefix: 'cms/'

# Google OAuth Configuration
auth:
  enable_identity_widget: true
  identity:
    url: https://identity.netlify.com

# Alternative: Direct Google OAuth (simpler for Decap)
oauth:
  provider: google
  client_id: YOUR_GOOGLE_CLIENT_ID
  redirect_uri: https://lokislab.org/admin/
  scopes:
    - email
    - profile

media_folder: public/images
public_folder: /images

collections:
  - name: articles
    label: Articles
    folder: Articles
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - name: title
        label: Title
        widget: string
        required: true
      - name: date
        label: Publish Date
        widget: datetime
        required: true
      - name: author
        label: Author
        widget: string
        required: true
      - name: summary
        label: Summary
        widget: text
        required: true
      - name: body
        label: Content
        widget: markdown
        required: true
      - name: tags
        label: Tags
        widget: list
        allow_add: true
      - name: featured_image
        label: Featured Image
        widget: image
        required: false

  - name: reviews
    label: Hardware Reviews
    folder: Articles/reviews
    create: true
    slug: '{{slug}}'
    fields:
      - name: title
        label: Review Title
        widget: string
        required: true
      - name: hardware
        label: Hardware
        widget: object
        fields:
          - name: name
            label: Product Name
            widget: string
          - name: cpu
            label: CPU
            widget: string
          - name: ram
            label: RAM
            widget: string
          - name: storage
            label: Storage
            widget: string
          - name: price
            label: Price
            widget: string
      - name: summary
        label: Summary
        widget: text
      - name: body
        label: Full Review
        widget: markdown
      - name: rating
        label: Rating
        widget: number
        min: 1
        max: 5
        step: 0.5

  - name: news
    label: News
    folder: Articles/news
    create: true
    slug: '{{slug}}'
    fields:
      - name: title
        label: News Title
        widget: string
      - name: date
        label: Date
        widget: datetime
      - name: source
        label: Source URL
        widget: string
      - name: summary
        label: Summary
        widget: markdown
